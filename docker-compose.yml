version: '3.8'

services:
  # ==========================================
  # DATABASES (PostgreSQL) - Ports 5432 -> 5435
  # ==========================================

  # 1. PostgreSQL for User Service (Port 5432)
  postgres-user:
    image: postgres:15-alpine
    container_name: postgres-user-service
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
      - ./docker/init-scripts/user-service-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. PostgreSQL for Core Banking Service (Port 5433)
  postgres-banking:
    image: postgres:15-alpine
    container_name: postgres-banking-service
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_password
    ports:
      - "5433:5432"
    volumes:
      - postgres-banking-data:/var/lib/postgresql/data
      - ./docker/init-scripts/core-banking-service-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_user -d banking_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. PostgreSQL for Log Service (Port 5434)
  postgres-log:
    image: postgres:15-alpine
    container_name: postgres-log-service
    environment:
      POSTGRES_DB: log_db
      POSTGRES_USER: log_user
      POSTGRES_PASSWORD: log_password
    ports:
      - "5434:5432"
    volumes:
      - postgres-log-data:/var/lib/postgresql/data
      - ./docker/init-scripts/log-service-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U log_user -d log_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. PostgreSQL for Notification Service (Port 5435)
  postgres-notification:
    image: postgres:15-alpine
    container_name: postgres-notification-service
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_password
    ports:
      - "5435:5432"
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
      - ./docker/init-scripts/notification-service-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # MESSAGE BROKER (Apache Kafka & Zookeeper)
  # ==========================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # MICROSERVICES (Backend) - Ports 8080 -> 8084
  # ==========================================

  # 0. API Gateway (Port 8080)
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8081
      CORE_BANKING_SERVICE_URL: http://core-banking-service:8082
      LOG_SERVICE_URL: http://log-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    depends_on:
      - user-service
      - core-banking-service
      - log-service
      - notification-service
    networks:
      - banking-network
    restart: unless-stopped

  # 1. User Service (Port 8081)
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/user_db
      SPRING_DATASOURCE_USERNAME: user_user
      SPRING_DATASOURCE_PASSWORD: user_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVICES_ACCOUNT_SERVICE_URL: http://core-banking-service:8082
    depends_on:
      postgres-user:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - banking-network
    restart: unless-stopped

  # 2. Core Banking Service (Port 8082)
  core-banking-service:
    build:
      context: ./services/core-banking-service
      dockerfile: Dockerfile
    container_name: core-banking-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-banking:5432/banking_db
      SPRING_DATASOURCE_USERNAME: banking_user
      SPRING_DATASOURCE_PASSWORD: banking_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVICES_USER_SERVICE_URL: http://user-service:8081
    depends_on:
      postgres-banking:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - banking-network
    restart: unless-stopped

  # 3. Log Service (Port 8083)
  log-service:
    build:
      context: ./services/log-service
      dockerfile: Dockerfile
    container_name: log-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-log:5432/log_db
      SPRING_DATASOURCE_USERNAME: log_user
      SPRING_DATASOURCE_PASSWORD: log_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres-log:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - banking-network
    restart: unless-stopped

  # 4. Notification Service (Port 8084)
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notification:5432/notification_db
      SPRING_DATASOURCE_USERNAME: notification_user
      SPRING_DATASOURCE_PASSWORD: notification_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - banking-network
    restart: unless-stopped

  # ==========================================
  # FRONTEND APPLICATIONS - Ports 3000 -> 3001
  # ==========================================

  frontend-customer:
    build:
      context: ./frontend/customer
      dockerfile: Dockerfile
    container_name: frontend-customer
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8080
      - REACT_APP_WS_URL=ws://localhost:8084/ws
    depends_on:
      - api-gateway
    networks:
      - banking-network
    restart: unless-stopped

  frontend-admin:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    container_name: frontend-admin
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - api-gateway
    networks:
      - banking-network
    restart: unless-stopped

networks:
  banking-network:
    driver: bridge

volumes:
  postgres-user-data:
  postgres-banking-data:
  postgres-log-data:
  postgres-notification-data:
