spring.application.name=core-banking-service
server.port=8082

# Database PostgreSQL cho Core Banking (Accounts, Balances, Transactions, Counters)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/banking_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:banking_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:banking_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP:core-banking-service-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

transaction.kafka.completed-topic=${TRANSACTION_COMPLETED_TOPIC:TRANSACTION_COMPLETED}
account.kafka.event-topic=${ACCOUNT_EVENT_TOPIC:ACCOUNT_EVENT}

# Internal service URL (UserService)
services.user-service.url=${SERVICES_USER_SERVICE_URL:http://localhost:8081}
internal.secret=${INTERNAL_SECRET:internal-secret}
